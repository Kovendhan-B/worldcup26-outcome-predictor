[project]
name = "worldcup26-outcome-predictor"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "catboost>=1.2.10",
    "joblib>=1.5.3",
    "pandas>=2.0.0",
    "scikit-learn>=1.9.0",
    "streamlit>=1.30.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pyright]
extraPaths = ["src", "."]
